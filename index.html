<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>رفيق الحفظ - المصحف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --text: #fff;
    --text-dim: #888;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.15);
    --green: #22c55e;
    --card: #111;
    --border: rgba(255, 255, 255, 0.08);
  }

  body.light {
    --bg: #faf7f0;
    --text: #1a1a1a;
    --text-dim: #666;
    --gold: #b8941f;
    --gold-soft: rgba(184, 148, 31, 0.15);
    --card: #fff;
    --border: rgba(0, 0, 0, 0.08);
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Tajawal', sans-serif;
  }

  html, body {
    height: 100%; overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background: var(--bg); color: var(--text);
    transition: background 0.3s, color 0.3s;
    overscroll-behavior: none;
  }

  #loginScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 30px 24px;
    background: radial-gradient(ellipse at top, #1a3a2e 0%, #000 70%);
    z-index: 200;
    transition: opacity 0.5s;
  }
  #loginScreen.hidden { opacity: 0; pointer-events: none; }

  .logo { font-size: 64px; margin-bottom: 12px; }
  .app-title { font-size: 28px; font-weight: 700; color: var(--gold); margin-bottom: 6px; }
  .app-subtitle { font-size: 14px; color: var(--text-dim); margin-bottom: 40px; }

  .login-form { width: 100%; max-width: 360px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--text); font-size: 15px; outline: none;
    font-family: 'Tajawal', sans-serif;
  }
  .field input:focus { border-color: var(--gold); }

  .login-btn {
    width: 100%; padding: 15px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #1a7f5a, #22c55e);
    color: #fff; font-size: 16px; font-weight: 700;
    cursor: pointer; margin-top: 8px;
    font-family: 'Tajawal', sans-serif;
  }
  .login-btn:active { transform: scale(0.97); }
  .error-msg { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }

  #mainScreen {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
  }
  #mainScreen.active { display: flex; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px;
    background: var(--bg);
    z-index: 100;
    transition: opacity 0.4s, transform 0.4s;
    border-bottom: 1px solid var(--border);
  }
  .top-bar.hidden-bar {
    opacity: 0;
    transform: translateY(-100%);
    pointer-events: none;
  }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: transparent; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text);
    transition: background 0.2s;
  }
  .icon-btn:active { background: var(--gold-soft); }
  .icon-btn svg {
    width: 22px; height: 22px;
    stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  .top-info { text-align: center; flex: 1; }
  .top-info .name { font-size: 15px; font-weight: 700; color: var(--text); }
  .top-info .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .header-actions { display: flex; gap: 2px; }

  .mushaf-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }

  .page-wrapper {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }

  .page {
    width: 100%;
    height: 100%;
    max-width: 700px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .page::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 1px solid var(--gold-soft);
    border-radius: 4px;
    pointer-events: none;
  }

  .page-header {
    text-align: center;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--gold-soft);
    flex-shrink: 0;
  }

  .page-header .surah-title {
    font-family: 'Amiri Quran', serif;
    font-size: 18px;
    color: var(--gold);
    margin-bottom: 2px;
  }

  .page-header .surah-info {
    font-size: 10px;
    color: var(--text-dim);
  }

  .page-content {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px 20px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    font-family: 'Amiri Quran', 'Traditional Arabic', serif;
    font-size: 17px;
    line-height: 2.4;
    color: var(--text);
    text-align: justify;
    text-align-last: center;
    direction: rtl;
    word-spacing: 3px;
  }
  .page-content::-webkit-scrollbar { display: none; }

  .verse-line {
    display: inline;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    padding: 2px 1px;
    border-radius: 3px;
  }
  .verse-line:active { background: var(--gold-soft); }
  .verse-line.playing { background: var(--gold-soft); color: var(--gold); }
  .verse-line.memorized { color: var(--green); }

  .verse-num {
    display: inline;
    font-family: 'Amiri Quran', serif;
    font-size: 15px;
    color: var(--gold);
    margin: 0 3px;
    font-weight: normal;
    white-space: nowrap;
  }

  .surah-name-banner {
    display: block;
    font-family: 'Amiri Quran', serif;
    font-size: 18px;
    color: var(--gold);
    text-align: center;
    padding: 8px;
    margin: 10px 0;
    background: var(--gold-soft);
    border-radius: 8px;
    border: 1px solid var(--gold-soft);
    clear: both;
  }

  .bismillah {
    display: block;
    text-align: center;
    font-family: 'Amiri Quran', serif;
    font-size: 17px;
    color: var(--gold);
    padding: 4px 0;
    margin-bottom: 4px;
  }

  .bottom-bar {
    position: fixed;
    bottom: 0; right: 0; left: 0;
    padding: 10px 14px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    z-index: 100;
    transition: opacity 0.4s, transform 0.4s;
  }
  .bottom-bar.hidden-bar {
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
  }

  .page-indicator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }
  .page-indicator .page-num {
    background: var(--gold-soft);
    color: var(--gold);
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
    min-width: 70px;
    text-align: center;
  }

  .action-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: var(--card);
    border-radius: 20px;
    padding: 6px;
    border: 1px solid var(--border);
  }

  .action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    background: none; border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 14px;
    font-family: 'Tajawal', sans-serif;
    font-size: 10px;
    transition: color 0.3s, background 0.3s;
    min-width: 55px;
  }
  .action-btn svg {
    width: 22px; height: 22px;
    stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .action-btn:active, .action-btn.active {
    color: var(--gold);
    background: var(--gold-soft);
  }

  .big-mic-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--green);
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.15), 0 4px 15px rgba(34, 197, 94, 0.4);
    transition: transform 0.2s;
    margin: 0 -6px;
  }
  .big-mic-btn:active { transform: scale(0.92); }
  .big-mic-btn svg {
    width: 26px; height: 26px;
    stroke: #fff; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .big-mic-btn.recording { animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.15), 0 4px 15px rgba(34, 197, 94, 0.4); }
    50% { box-shadow: 0 0 0 14px rgba(34, 197, 94, 0.05), 0 4px 25px rgba(34, 197, 94, 0.6); }
  }

  #surahList {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none; flex-direction: column;
    z-index: 150;
    animation: slideRight 0.3s ease;
  }
  #surahList.active { display: flex; }
  @keyframes slideRight {
    from { transform: translateX(100%); }
    to { transform: translateX(0); }
  }

  .list-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .list-header h2 { font-size: 18px; color: var(--gold); }

  .surah-search {
    margin: 12px 16px; padding: 12px 16px;
    border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text);
    font-size: 14px; outline: none;
    font-family: 'Tajawal', sans-serif;
  }

  .surah-items {
    flex: 1; overflow-y: auto;
    padding: 0 12px 20px;
  }

  .surah-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; margin-bottom: 6px;
    background: var(--card); border-radius: 12px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .surah-item:active { background: var(--gold-soft); }

  .surah-item .num-circle {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--gold-soft);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    margin-left: 12px;
    border: 1px solid var(--gold);
  }

  .surah-item .surah-info { flex: 1; text-align: right; }
  .surah-item .surah-info .name { font-size: 15px; font-weight: 500; }
  .surah-item .surah-info .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  #tafsirScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none; flex-direction: column;
    z-index: 150;
    padding: 16px;
    animation: slideUp 0.3s ease;
  }
  #tafsirScreen.active { display: flex; }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .tafsir-content {
    flex: 1; overflow-y: auto;
    padding: 20px;
    background: var(--card);
    border-radius: 16px;
    margin-top: 12px;
    line-height: 2;
    font-size: 15px;
  }

  #settingsScreen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: none; flex-direction: column;
    z-index: 150;
    padding: 16px;
    animation: slideUp 0.3s ease;
  }
  #settingsScreen.active { display: flex; }

  .settings-list { margin-top: 12px; }

  .setting-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px;
    background: var(--card);
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }
  .setting-item .label { font-size: 15px; }
  .setting-item .value { font-size: 13px; color: var(--text-dim); }

  .font-size-controls { display: flex; gap: 8px; }
  .font-btn {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--gold-soft);
    color: var(--gold);
    border: 1px solid var(--gold);
    font-size: 16px; font-weight: bold;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
  }
  .font-btn:active { background: var(--gold); color: #000; }

  .reciter-select {
    background: var(--gold-soft);
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 8px 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    outline: none;
    max-width: 180px;
    cursor: pointer;
  }
  .reciter-select option {
    background: var(--card);
    color: var(--text);
  }

  .toast {
    position: fixed; bottom: 140px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--card); color: var(--text);
    padding: 12px 24px; border-radius: 12px;
    border: 1px solid var(--gold); font-size: 14px;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    z-index: 250; max-width: 90%; text-align: center;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .loader {
    text-align: center; padding: 40px 20px;
    color: var(--text-dim); font-size: 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="logo">📖</div>
  <h1 class="app-title">رفيق الحفظ</h1>
  <p class="app-subtitle">المصحف الشريف</p>

  <div class="login-form">
    <div class="field">
      <label>اسم المستخدم</label>
      <input type="text" id="usernameInput" placeholder="أدخل اسمك" autocomplete="off">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="passwordInput" placeholder="أدخل كلمة المرور" autocomplete="off">
    </div>
    <button class="login-btn" onclick="handleLogin()">دخول</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div id="mainScreen">
  <div class="top-bar" id="topBar">
    <button class="icon-btn" onclick="openSurahList()">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="top-info">
      <div class="name" id="surahTitle">المصحف الشريف</div>
      <div class="meta" id="surahMeta">٦٠٤ صفحة</div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="openSettings()">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <div class="mushaf-container" id="mushafContainer">
    <div class="page-wrapper" id="pageWrapper">
      <div class="page">
        <div class="loader">
          <div class="spinner"></div>
          <div>جاري تحميل الصفحة...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div class="page-indicator">
      <span class="page-num" id="pageIndicator">١ / ٦٠٤</span>
    </div>

    <div class="action-row">
      <button class="action-btn" onclick="openTafsirFromCurrent()">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>تفسير</span>
      </button>

      <button class="action-btn" onclick="togglePlayPause()" id="playBtn">
        <svg viewBox="0 0 24 24" id="playIconSvg">
          <polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>
        </svg>
        <span id="playText">استماع</span>
      </button>

      <button class="big-mic-btn" onclick="toggleMic()" id="micBtn">
        <svg viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>

      <button class="action-btn" onclick="toggleTheme()">
        <svg viewBox="0 0 24 24" id="themeIcon">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span>الوضع</span>
      </button>

      <button class="action-btn" onclick="goToPage(state.currentPage)" id="refreshBtn">
        <svg viewBox="0 0 24 24">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span>تحديث</span>
      </button>
    </div>
  </div>
</div>

<div id="surahList">
  <div class="list-header">
    <h2>📖 السور</h2>
    <button class="icon-btn" onclick="closeSurahList()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <input type="text" class="surah-search" id="surahSearch" placeholder="ابحث عن سورة..." oninput="filterSurahs()">
  <div class="surah-items" id="surahItems">
    <div class="loader"><div class="spinner"></div></div>
  </div>
</div>

<div id="tafsirScreen">
  <div class="list-header">
    <h2>📖 التفسير</h2>
    <button class="icon-btn" onclick="closeTafsir()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="tafsir-content" id="tafsirContent"></div>
</div>

<div id="settingsScreen">
  <div class="list-header">
    <h2>⚙️ الإعدادات</h2>
    <button class="icon-btn" onclick="closeSettings()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="settings-list">
    <div class="setting-item">
      <span class="label">🌙 الوضع الليلي</span>
      <button class="font-btn" onclick="toggleTheme()">تبديل</button>
    </div>
    <div class="setting-item">
      <span class="label">🔤 حجم الخط</span>
      <div class="font-size-controls">
        <button class="font-btn" onclick="changeFontSize(-1)">A-</button>
        <button class="font-btn" onclick="changeFontSize(1)">A+</button>
      </div>
    </div>
    <div class="setting-item">
      <span class="label">🎙️ القارئ</span>
      <select id="reciterSelect" class="reciter-select" onchange="changeReciter(this.value)"></select>
    </div>
    <div class="setting-item">
      <span class="label">📊 الصفحة الحالية</span>
      <span class="value" id="settingsPageNum">١</span>
    </div>
    <div class="setting-item" onclick="logout()" style="cursor: pointer;">
      <span class="label">🚪 تسجيل الخروج</span>
      <span class="value">›</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = 'https://api.alquran.cloud/v1';
const EVERYAYAH_BASE = 'https://everyayah.com/data/';
const TOTAL_PAGES = 604;

// ⭐ قائمة القراء مع مسارات everyayah.com الصحيحة
const RECITERS = [
  { id: 'ar.alafasy', name: 'مشاري العفاسي', everyayah: 'Alafasy_128kbps' },
  { id: 'ar.muhammadluhaidan', name: 'محمد اللحيدان', everyayah: 'Muhammad_Alhaidan_128kbps' },
  { id: 'ar.abdulbasitmurattal', name: 'عبد الباسط عبد الصمد', everyayah: 'Abdul_Basit_Murattal_192kbps' },
  { id: 'ar.mahermuaiqly', name: 'ماهر المعيقلي', everyayah: 'Maher_AlMuaiqly_128kbps' },
  { id: 'ar.yasirdosari', name: 'ياسر الدوسري', everyayah: 'Yasser_Ad-Dussary_128kbps' },
  { id: 'ar.saoodshuraym', name: 'سعد الغامدي', everyayah: 'Saad_Al-Ghamdi_128kbps' },
  { id: 'ar.minshawi', name: 'محمد صديق المنشاوي', everyayah: 'Minshawy_Murattal_128kbps' },
  { id: 'ar.ahmedajamy', name: 'أحمد بن علي العجمي', everyayah: 'Ahmed_ibn_Ali_al-Ajamy_128kbps' },
  { id: 'ar.husary', name: 'محمود خليل الحصري', everyayah: 'Husary_128kbps' },
  { id: 'ar.hudhaify', name: 'علي الحذيفي', everyayah: 'Hudhaify_128kbps' },
  { id: 'ar.muhammadayyoub', name: 'محمد أيوب', everyayah: 'Muhammad_Ayyoub_128kbps' },
  { id: 'ar.hanirifai', name: 'هاني الرفاعي', everyayah: 'Hani_Rifai_192kbps' },
  { id: 'ar.ibrahimakhbar', name: 'إبراهيم الأخضر', everyayah: 'Ibrahim_Akhdar_128kbps' },
  { id: 'ar.aymanswoaid', name: 'أيمن سويد', everyayah: 'Ayman_Sowaid_128kbps' },
  { id: 'ar.shaatree', name: 'أبو بكر الشاطري', everyayah: 'Abu_Bakr_Ash-Shaatree_128kbps' },
  { id: 'ar.abdullahbasfar', name: 'عبد الله بصفر', everyayah: 'Abdullah_Basfar_192kbps' },
  { id: 'ar.abdurrahmaansudais', name: 'عبد الرحمن السديس', everyayah: 'Abdurrahmaan_As-Sudais_192kbps' }
];

let state = {
  user: null,
  currentPage: 1,
  pageData: null,
  surahs: [],
  memorized: {},
  audio: null,
  theme: 'dark',
  fontSize: 17,
  audioEdition: 'ar.alafasy',
  isPlaying: false,
  isRecording: false,
  mediaRecorder: null,
  audioChunks: [],
  hideUITimer: null,
  currentSurahNumber: 1,
  currentAyahNumber: 1
};

const FORBIDDEN_WORDS = [
  'خرا', 'خرة', 'احمار', 'حمار', 'كلب', 'حقير', 'تافه', 'غبي', 'احمق',
  'أحمق', 'خنزير', 'قذر', 'وسخ', 'لعنة', 'زبالة', 'خرائي', 'كلبة',
  'fuck', 'shit', 'bitch', 'ass', 'damn'
];

function containsForbidden(text) {
  const lower = text.toLowerCase().trim();
  return FORBIDDEN_WORDS.some(word => lower.includes(word));
}

function handleLogin() {
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const errorEl = document.getElementById('errorMsg');

  if (!username || !password) {
    errorEl.textContent = '⚠️ الرجاء إدخال البيانات';
    return;
  }
  if (username.length < 2) {
    errorEl.textContent = '⚠️ اسم المستخدم قصير';
    return;
  }
  if (password.length < 3) {
    errorEl.textContent = '⚠️ كلمة المرور قصيرة';
    return;
  }
  if (containsForbidden(username)) {
    errorEl.textContent = '🚫 هذا الاسم غير مسموح';
    return;
  }

  state.user = { username, password: btoa(password) };
  localStorage.setItem('quranUser', JSON.stringify(state.user));

  document.getElementById('loginScreen').classList.add('hidden');
  setTimeout(() => {
    document.getElementById('mainScreen').classList.add('active');
    initMainScreen();
  }, 400);
}

function logout() {
  if (!confirm('تسجيل الخروج؟')) return;
  localStorage.removeItem('quranUser');
  location.reload();
}

async function initMainScreen() {
  loadUserData();
  loadTheme();
  loadFontSize();
  loadReciter();
  loadLastPage();
  await loadSurahs();
  await loadPage(state.currentPage);
  startHideUITimer();
}

function loadUserData() {
  state.memorized = JSON.parse(localStorage.getItem('quranMemorized') || '{}');
}

function loadLastPage() {
  const saved = localStorage.getItem('quranLastPage');
  if (saved) {
    state.currentPage = parseInt(saved) || 1;
  }
}

function saveLastPage() {
  localStorage.setItem('quranLastPage', state.currentPage);
}

function loadFontSize() {
  const saved = localStorage.getItem('quranFontSize');
  if (saved) {
    state.fontSize = parseInt(saved);
  }
}

function changeFontSize(delta) {
  state.fontSize = Math.max(14, Math.min(30, state.fontSize + delta));
  localStorage.setItem('quranFontSize', state.fontSize);
  applyFontSize();
  showToast(`حجم الخط: ${state.fontSize}px`);
}

function applyFontSize() {
  const content = document.querySelector('.page-content');
  if (content) content.style.fontSize = state.fontSize + 'px';
}

function loadReciter() {
  const saved = localStorage.getItem('quranReciter');
  if (saved && RECITERS.some(r => r.id === saved)) {
    state.audioEdition = saved;
  }
}

function changeReciter(reciterId) {
  state.audioEdition = reciterId;
  localStorage.setItem('quranReciter', reciterId);
  const reciter = RECITERS.find(r => r.id === reciterId);
  if (reciter) showToast(`🎙️ ${reciter.name}`);
}

async function loadSurahs() {
  try {
    const res = await fetch(`${API_BASE}/surah`);
    const data = await res.json();
    state.surahs = data.data;
    renderSurahList();
  } catch (e) {
    console.error('فشل تحميل السور:', e);
  }
}

function renderSurahList(filter = '') {
  const container = document.getElementById('surahItems');
  const filtered = state.surahs.filter(s =>
    s.name.includes(filter) || s.englishName.toLowerCase().includes(filter.toLowerCase())
  );

  if (filtered.length === 0) {
    container.innerHTML = '<div class="loader">لا توجد نتائج</div>';
    return;
  }

  container.innerHTML = '';
  filtered.forEach(surah => {
    const item = document.createElement('div');
    item.className = 'surah-item';
    item.innerHTML = `
      <div class="num-circle">${toArabicNum(surah.number)}</div>
      <div class="surah-info">
        <div class="name">سورة ${surah.name}</div>
        <div class="meta">${surah.numberOfAyahs} آية • ${surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</div>
      </div>
    `;
    item.onclick = () => {
      closeSurahList();
      goToSurah(surah.number);
    };
    container.appendChild(item);
  });
}

function filterSurahs() {
  const q = document.getElementById('surahSearch').value.trim();
  renderSurahList(q);
}

function openSurahList() {
  document.getElementById('surahList').classList.add('active');
  showUI();
}
function closeSurahList() {
  document.getElementById('surahList').classList.remove('active');
}

async function loadPage(pageNum) {
  if (pageNum < 1 || pageNum > TOTAL_PAGES) return;

  state.currentPage = pageNum;
  saveLastPage();
  updatePageIndicator();

  const wrapper = document.getElementById('pageWrapper');
  wrapper.querySelector('.page').innerHTML = `
    <div class="loader">
      <div class="spinner"></div>
      <div>جاري تحميل الصفحة ${toArabicNum(pageNum)}...</div>
    </div>
  `;

  try {
    const res = await fetch(`${API_BASE}/page/${pageNum}/quran-uthmani`);
    const data = await res.json();
    state.pageData = data.data;

    renderPage(data.data);
    updateTopBar(data.data);
  } catch (e) {
    console.error('فشل تحميل الصفحة:', e);
    wrapper.querySelector('.page').innerHTML = `
      <div class="loader">
        <div style="font-size: 40px;">⚠️</div>
        <div>فشل تحميل الصفحة</div>
        <div style="margin-top: 8px; font-size: 12px;">تأكد من اتصالك بالإنترنت</div>
        <button class="login-btn" style="margin-top: 20px; max-width: 200px;" onclick="loadPage(${pageNum})">إعادة المحاولة</button>
      </div>
    `;
  }
}

function renderPage(pageData) {
  const page = document.getElementById('pageWrapper').querySelector('.page');
  const ayahs = pageData.ayahs;
  const surahName = pageData.surahs?.[0]?.name || '';

  let html = '';

  html += `
    <div class="page-header">
      <div class="surah-title">${surahName ? 'سورة ' + surahName : ''}</div>
      <div class="surah-info">صفحة ${toArabicNum(pageData.number)} • جزء ${toArabicNum(Math.ceil(pageData.number / 20))}</div>
    </div>
    <div class="page-content" style="font-size: ${state.fontSize}px;">
  `;

  let currentSurah = null;
  ayahs.forEach((ayah, index) => {
    if (ayah.surah?.number !== currentSurah) {
      currentSurah = ayah.surah?.number;
      if (index > 0 && ayah.surah) {
        html += `<span class="surah-name-banner">سورة ${ayah.surah.name}</span>`;
      } else if (index === 0 && ayah.surah && ayah.surah.number !== 1 && ayah.surah.number !== 9) {
        html += `<span class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>`;
      }
    }

    const key = `${ayah.surah?.number}-${ayah.numberInSurah}`;
    const memorizedClass = state.memorized[key] ? 'memorized' : '';

    html += `<span class="verse-line ${memorizedClass}" 
                   data-surah="${ayah.surah?.number}" 
                   data-ayah="${ayah.numberInSurah}"
                   onclick="onVerseClick(${ayah.surah?.number}, ${ayah.numberInSurah}, ${ayah.number}, '${ayah.text.replace(/'/g, "\\'")}')">${ayah.text}<span class="verse-num">{${toArabicNum(ayah.numberInSurah)}}</span></span> `;
  });

  html += '</div>';
  page.innerHTML = html;
}

function updateTopBar(pageData) {
  const surahName = pageData.surahs?.[0]?.name || '';
  document.getElementById('surahTitle').textContent = surahName ? 'سورة ' + surahName : 'المصحف';
  document.getElementById('surahMeta').textContent = `صفحة ${toArabicNum(pageData.number)} من ${toArabicNum(TOTAL_PAGES)}`;
  document.getElementById('settingsPageNum').textContent = toArabicNum(pageData.number);
}

function updatePageIndicator() {
  document.getElementById('pageIndicator').textContent = `${toArabicNum(state.currentPage)} / ${toArabicNum(TOTAL_PAGES)}`;
}

function toArabicNum(num) {
  const arabic = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  return String(num).split('').map(d => arabic[d] || d).join('');
}

function nextPage() {
  if (state.currentPage < TOTAL_PAGES) {
    animateTransition('next');
    setTimeout(() => loadPage(state.currentPage + 1), 200);
  } else {
    showToast('وصلت لآخر صفحة');
  }
}

function prevPage() {
  if (state.currentPage > 1) {
    animateTransition('prev');
    setTimeout(() => loadPage(state.currentPage - 1), 200);
  } else {
    showToast('هذه أول صفحة');
  }
}

function animateTransition(direction) {
  const wrapper = document.getElementById('pageWrapper');
  const toX = direction === 'next' ? '-30%' : '30%';

  wrapper.style.transition = 'transform 0.2s, opacity 0.2s';
  wrapper.style.transform = `translateX(${toX})`;
  wrapper.style.opacity = '0';

  setTimeout(() => {
    wrapper.style.transition = 'none';
    wrapper.style.transform = 'translateX(0)';
    wrapper.style.opacity = '1';
    setTimeout(() => {
      wrapper.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
    }, 50);
  }, 200);
}

async function goToSurah(surahNumber) {
  try {
    const res = await fetch(`${API_BASE}/surah/${surahNumber}`);
    const data = await res.json();
    if (data.data && data.data.ayahs && data.data.ayahs[0]) {
      const pageNum = data.data.ayahs[0].page;
      await loadPage(pageNum);
    }
  } catch (e) {
    showToast('⚠️ فشل الانتقال للسورة');
  }
}

let touchStartX = 0;
let touchStartY = 0;
let isSwiping = false;

document.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  isSwiping = false;
  showUI();
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (isSwiping) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;

  if (Math.abs(dx) > Math.abs(dy) * 1.5 && Math.abs(dx) > 10) {
    isSwiping = true;
  }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (!isSwiping) return;

  const touchEndX = e.changedTouches[0].clientX;
  const touchEndY = e.changedTouches[0].clientY;
  const diffX = touchEndX - touchStartX;
  const diffY = touchEndY - touchStartY;

  if (Math.abs(diffX) > 70 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
    if (diffX > 0) {
      prevPage();
    } else {
      nextPage();
    }
  }
}, { passive: true });

function onVerseClick(surahNum, ayahNum, globalAyahNum, text) {
  const key = `${surahNum}-${ayahNum}`;
  const isMemorized = !!state.memorized[key];

  state.currentSurahNumber = surahNum;
  state.currentAyahNumber = ayahNum;

  const action = prompt(
    `📖 ${text}\n\n` +
    `1 = تلاوة\n` +
    `2 = ${isMemorized ? 'إزالة من المحفوظات' : 'حفظ'}\n` +
    `3 = تلاوة + حفظ\n` +
    `4 = تفسير`,
    '3'
  );

  if (action === '1') playAyah(globalAyahNum, surahNum, ayahNum);
  else if (action === '2') toggleMemorize(surahNum, ayahNum, text);
  else if (action === '3') {
    playAyah(globalAyahNum, surahNum, ayahNum);
    setTimeout(() => toggleMemorize(surahNum, ayahNum, text), 300);
  }
  else if (action === '4') showTafsir(globalAyahNum, text, surahNum, ayahNum);
}

// ⭐ دالة تشغيل الصوت الجديدة باستخدام everyayah.com
async function playAyah(globalAyahNum, surahNum, ayahNum) {
  stopAllAudio();
  showToast('🔊 جاري التحميل...');

  const reciter = RECITERS.find(r => r.id === state.audioEdition);
  if (!reciter) {
    showToast('⚠️ القارئ غير متوفر');
    return;
  }

  // بناء رابط everyayah.com: {surah}{ayah}.mp3 مع تبطين بـ 3 أصفار
  const surahPadded = String(surahNum).padStart(3, '0');
  const ayahPadded = String(ayahNum).padStart(3, '0');
  const audioUrl = `${EVERYAYAH_BASE}${reciter.everyayah}/${surahPadded}${ayahPadded}.mp3`;

  try {
    state.audio = new Audio(audioUrl);
    state.audio.play().catch(() => {
      showToast('⚠️ فشل التشغيل، قد يكون الصوت غير متوفر لهذا القارئ');
    });
    state.isPlaying = true;
    updatePlayIcon();

    const el = document.querySelector(`.verse-line[data-surah="${surahNum}"][data-ayah="${ayahNum}"]`);
    if (el) {
      el.classList.add('playing');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    state.audio.onended = () => {
      document.querySelectorAll('.verse-line').forEach(el => el.classList.remove('playing'));
      state.isPlaying = false;
      updatePlayIcon();
    };
  } catch (e) {
    showToast('⚠️ فشل التشغيل');
  }
}

function togglePlayPause() {
  if (state.isPlaying && state.audio) {
    stopAllAudio();
    return;
  }
  if (state.pageData && state.pageData.ayahs && state.pageData.ayahs[0]) {
    const firstAyah = state.pageData.ayahs[0];
    playAyah(firstAyah.number, firstAyah.surah.number, firstAyah.numberInSurah);
  }
}

function updatePlayIcon() {
  const svg = document.getElementById('playIconSvg');
  const text = document.getElementById('playText');
  if (state.isPlaying) {
    svg.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/>';
    if (text) text.textContent = 'إيقاف';
  } else {
    svg.innerHTML = '<polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/>';
    if (text) text.textContent = 'استماع';
  }
}

function stopAllAudio() {
  if (state.audio) {
    state.audio.pause();
    state.audio.currentTime = 0;
    state.audio = null;
  }
  state.isPlaying = false;
  updatePlayIcon();
  document.querySelectorAll('.verse-line').forEach(el => el.classList.remove('playing'));
}

function toggleMemorize(surahNum, ayahNum, text) {
  const key = `${surahNum}-${ayahNum}`;

  if (state.memorized[key]) {
    delete state.memorized[key];
    showToast('🗑️ تم الإزالة');
  } else {
    const surah = state.surahs.find(s => s.number === surahNum);
    state.memorized[key] = {
      surah: surahNum,
      surahName: surah?.name || '',
      verseNum: ayahNum,
      text: text,
      date: new Date().toISOString()
    };
    showToast('✅ تم الحفظ');
  }

  localStorage.setItem('quranMemorized', JSON.stringify(state.memorized));

  const el = document.querySelector(`.verse-line[data-surah="${surahNum}"][data-ayah="${ayahNum}"]`);
  if (el) el.classList.toggle('memorized', !!state.memorized[key]);
}

async function showTafsir(globalAyahNum, text, surahNum, ayahNum) {
  document.getElementById('tafsirScreen').classList.add('active');
  const content = document.getElementById('tafsirContent');
  content.innerHTML = '<div class="loader"><div class="spinner"></div><div>جاري التحميل...</div></div>';

  try {
    const res = await fetch(`${API_BASE}/ayah/${globalAyahNum}/ar.jalalayn`);
    const data = await res.json();
    const surah = state.surahs.find(s => s.number === surahNum);

    content.innerHTML = `
      <div style="font-family: 'Amiri Quran', serif; font-size: 20px; color: var(--gold); margin-bottom: 16px; text-align: center; line-height: 1.8;">
        ${text}
      </div>
      <div style="color: var(--text-dim); font-size: 12px; text-align: center; margin-bottom: 20px;">
        سورة ${surah?.name} - آية ${toArabicNum(ayahNum)}
      </div>
      <hr style="border: none; border-top: 1px solid var(--border); margin: 16px 0;">
      <div style="font-size: 15px; line-height: 2;">
        ${data.data.text}
      </div>
    `;
  } catch (e) {
    content.innerHTML = '<div class="loader">⚠️ تعذّر تحميل التفسير</div>';
  }
}

function openTafsirFromCurrent() {
  if (!state.pageData || !state.pageData.ayahs || !state.pageData.ayahs[0]) return;
  const firstAyah = state.pageData.ayahs[0];
  showTafsir(firstAyah.number, firstAyah.text, firstAyah.surah.number, firstAyah.numberInSurah);
}

function closeTafsir() {
  document.getElementById('tafsirScreen').classList.remove('active');
}

function openSettings() {
  document.getElementById('settingsScreen').classList.add('active');
  
  const select = document.getElementById('reciterSelect');
  select.innerHTML = '';
  RECITERS.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.id;
    opt.textContent = r.name;
    if (r.id === state.audioEdition) opt.selected = true;
    select.appendChild(opt);
  });
  
  showUI();
}

function closeSettings() {
  document.getElementById('settingsScreen').classList.remove('active');
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.body.classList.toggle('light', state.theme === 'light');
  localStorage.setItem('quranTheme', state.theme);
}

function loadTheme() {
  const saved = localStorage.getItem('quranTheme');
  if (saved) {
    state.theme = saved;
    document.body.classList.toggle('light', saved === 'light');
  }
}

async function toggleMic() {
  const btn = document.getElementById('micBtn');

  if (state.isRecording) {
    if (state.mediaRecorder) state.mediaRecorder.stop();
    state.isRecording = false;
    btn.classList.remove('recording');
    showToast('⏹️ تم الإيقاف');
    return;
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.mediaRecorder = new MediaRecorder(stream);
    state.audioChunks = [];

    state.mediaRecorder.ondataavailable = (e) => {
      state.audioChunks.push(e.data);
    };

    state.mediaRecorder.onstop = () => {
      const blob = new Blob(state.audioChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      new Audio(url).play();
      showToast('▶️ تسجيلك');
      stream.getTracks().forEach(t => t.stop());
    };

    state.mediaRecorder.start();
    state.isRecording = true;
    btn.classList.add('recording');
    showToast('🎤 جاري التسجيل...');
  } catch (e) {
    showToast('⚠️ تعذّر الوصول للميكروفون');
  }
}

function showUI() {
  document.getElementById('topBar').classList.remove('hidden-bar');
  document.getElementById('bottomBar').classList.remove('hidden-bar');
  startHideUITimer();
}

function hideUI() {
  document.getElementById('topBar').classList.add('hidden-bar');
  document.getElementById('bottomBar').classList.add('hidden-bar');
}

function startHideUITimer() {
  clearTimeout(state.hideUITimer);
  state.hideUITimer = setTimeout(hideUI, 4000);
}

document.addEventListener('touchstart', showUI, { passive: true });
document.addEventListener('click', showUI);

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

window.addEventListener('load', () => {
  const savedUser = localStorage.getItem('quranUser');
  if (savedUser) {
    state.user = JSON.parse(savedUser);
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('mainScreen').classList.add('active');
    initMainScreen();
  }

  document.getElementById('passwordInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('usernameInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('passwordInput').focus();
  });
});
</script>
</body>
</html>
